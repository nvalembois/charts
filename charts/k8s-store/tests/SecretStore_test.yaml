suite: test ArgoCD SecretStore
release:
  name: release-name
  namespace: release-namespace
templates:
  - SecretStore.yaml
tests:
  - it: should conform to default values
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: SecretStore
      - equal:
          path: metadata.name
          value: release-name
      - equal:
          path: metadata.namespace
          value: release-namespace
      - equal:
          path: spec
          value:
            provider:
              kubernetes: 
                remoteNamespace: release-namespace
                server:
                  caProvider:
                    type: ConfigMap
                    name: kube-root-ca.crt
                    key: ca.crt
                auth:
                  serviceAccount:
                    name: release-name
  - it: should conform to direct values (even if global values are set)
    set:
      name: 'set-name'
      namespace: 'set-namespace'
      global:
        namespace: 'global-namespace'
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: SecretStore
      - equal:
          path: metadata.name
          value: set-name
      - equal:
          path: metadata.namespace
          value: set-namespace
      - equal:
          path: spec
          value:
            provider:
              kubernetes: 
                remoteNamespace: set-namespace
                server:
                  caProvider:
                    type: ConfigMap
                    name: kube-root-ca.crt
                    key: ca.crt
                auth:
                  serviceAccount:
                    name: set-name
  - it: should conform to global values
    set:
      global:
        namespace: 'global-namespace'
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: SecretStore
      - equal:
          path: metadata.name
          value: release-name
      - equal:
          path: metadata.namespace
          value: global-namespace
      - equal:
          path: spec
          value:
            provider:
              kubernetes: 
                remoteNamespace: global-namespace
                server:
                  caProvider:
                    type: ConfigMap
                    name: kube-root-ca.crt
                    key: ca.crt
                auth:
                  serviceAccount:
                    name: release-name
