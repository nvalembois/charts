suite: test ArgoCD ServiceAccount
release:
  name: release-name
  namespace: release-namespace
templates:
  - ServiceAccount.yaml
tests:
  - it: should conform to default values
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: release-name
      - equal:
          path: metadata.namespace
          value: release-namespace
  - it: should conform to direct values (even if global values are set)
    set:
      name: 'set-name'
      namespace: 'set-namespace'
      global:
        namespace: 'global-namespace'
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: set-name
      - equal:
          path: metadata.namespace
          value: set-namespace
  - it: should conform to global values
    set:
      global:
        namespace: 'global-namespace'
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: release-name
      - equal:
          path: metadata.namespace
          value: global-namespace
  - it: should do nothing if enabled=false
    set:
      enabled: false
    asserts:
      - hasDocuments:
          count: 0
